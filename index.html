<!doctype html>
<html lang="en" class="dark">
  <head>
    
    <meta name="theme-color" content="#10B981">
    <meta name="description" content="Progressive Web App designed for an Android tablet with Google Calendar and AI sync.">
    <meta property="og:title" content="Axion">
    <meta property="og:description" content="Progressive Web App designed for an Android tablet with Google Calendar and AI sync.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Axion">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axion</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="text-on-surface font-body h-screen w-screen overflow-hidden flex flex-col select-none">
    <div id="root" class="flex flex-col flex-1 h-full w-full relative overflow-hidden"></div>
    <script>
      // Per AI Studio build constraints: HMR is disabled, ignore WebSocket errors
      window.addEventListener('unhandledrejection', function(e) {
        const msg = (e?.reason?.message || String(e?.reason || '')).toLowerCase();
        if (msg.includes('websocket') || msg.includes('vite') || msg.includes('closed without opened')) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return false;
        }
      });
      window.addEventListener('error', function(e) {
        const msg = (e?.message || String(e?.error || '')).toLowerCase();
        if (msg.includes('websocket') || msg.includes('closed without opened') || msg.includes('vite')) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return false;
        }
      });
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
